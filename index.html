<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Flow Trading</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0f14;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 15px;
      background: #111821;
      border-bottom: 1px solid #26303b;
      font-size: 20px;
      font-weight: bold;
    }

    .symbol {
      padding: 12px;
      font-size: 18px;
    }

    .chart {
      height: 300px;
      margin: 10px;
      background: #111820;
      border: 1px solid #26303b;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8b98a8;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 10px;
    }

    .box {
      background: #111820;
      border: 1px solid #26303b;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .value {
      margin-top: 6px;
      font-size: 18px;
      font-weight: bold;
    }

    .orderbook {
      margin: 10px;
      background: #111820;
      border: 1px solid #26303b;
      border-radius: 8px;
      overflow: hidden;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      padding: 10px;
      text-align: center;
      border-bottom: 1px solid #202832;
    }

    .header-row {
      font-weight: bold;
      background: #18212b;
    }

    .buy {
      color: #28d17c;
    }

    .sell {
      color: #ff5c5c;
    }
  </style>
</head>

<body>

  <header>
    📊 ORDER FLOW
  </header>

  <div class="symbol">
    XAUUSD — Gold
  </div>

  <div class="chart">
    📈 CHART WILL COME HERE
  </div>

  <div class="stats">

    <div class="box">
      Delta
      <div class="value buy">+125</div>
    </div>

    <div class="box">
      Volume
      <div class="value">18.4K</div>
    </div>

    <div class="box">
      Cumulative
      <div class="value buy">+2,450</div>
    </div>

  </div>

  <div class="orderbook">

    <div class="row header-row">
      <div>BID</div>
      <div>PRICE</div>
      <div>ASK</div>
    </div>

    <div class="row">
      <div class="buy">120</div>
      <div>2650.20</div>
      <div class="sell">180</div>
    </div>

    <div class="row">
      <div class="buy">250</div>
      <div>2650.10</div>
      <div class="sell">310</div>
    </div>

    <div class="row">
      <div class="buy">340</div>
      <div>2650.00</div>
      <div class="sell">150</div>
    </div>

  </div>

</body>
</html>
